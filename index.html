<!DOCTYPE html>
<html>
<head>
  <title>EMI Tracker V6</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>💰 EMI Tracker Pro</h1>

<div class="top-bar">
  <button onclick="login()">🔐 Login</button>
  <button onclick="showStrategy()">📊 Strategy</button>
  <button onclick="getAIInsights()">🧠 AI Insights</button>
</div>

<div class="dashboard">
  <div class="card">Paid: ₹<span id="totalPaid">0</span></div>
  <div class="card">Remaining: ₹<span id="totalRemaining">0</span></div>
  <div class="card">EMIs Left: <span id="monthsLeft">0</span></div>
  <div class="card">Debt-Free: <span id="debtFreeDate">-</span></div>
</div>

<div class="form glass">
  <input id="name" placeholder="Loan Name">
  <input id="amount" type="number" placeholder="Total Amount">
  <input id="emi" type="number" placeholder="EMI">
  <input id="interest" type="number" placeholder="Interest %">
  <input id="start" type="date">
  <input id="tenure" type="number" placeholder="Tenure">
  <button onclick="addLoan()">Add Loan</button>
</div>

<div class="prepay glass">
  <h3>💸 Prepayment Simulator</h3>
  <input id="extra" type="number" placeholder="Extra per month">
  <button onclick="simulate()">Simulate</button>
  <p id="result"></p>
</div>

<h3>📊 Overall Status</h3>
<canvas id="chart"></canvas>

<h3>📈 Amortization Chart</h3>
<canvas id="amortChart"></canvas>

<div id="aiBox" class="glass"></div>

<div id="loans"></div>

<script src="app.js"></script>
</body>
</html>
