<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EMI Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<header>
  <h2>◈ EMI Tracker</h2>
  <button onclick="login()">Connect</button>
</header>

<div id="userProfile" class="hidden profile">
  <img id="userPic" alt="avatar">
  <div>
    <div id="userName"></div>
    <div id="userEmail"></div>
  </div>
  <button onclick="logout()">Sign out</button>
</div>

<!-- ═══════════════ DASHBOARD ═══════════════ -->
<div class="screen active" id="dashboard">

  <p class="section-label">Overview</p>

  <div class="cards">
    <div class="card accent-card">
      <div class="card-label">Total Paid</div>
      <div class="card-value">₹<span id="totalPaid">0</span></div>
      <div class="card-icon">✓</div>
    </div>
    <div class="card">
      <div class="card-label">Remaining</div>
      <div class="card-value">₹<span id="totalRemaining">0</span></div>
      <div class="card-icon">◎</div>
    </div>
    <div class="card">
      <div class="card-label">EMIs Left</div>
      <div class="card-value"><span id="monthsLeft">0</span></div>
      <div class="card-icon">≡</div>
    </div>
    <div class="card">
      <div class="card-label">Debt-Free</div>
      <div class="card-value" style="font-size:13px; padding-top:4px;"><span id="debtFreeDate">—</span></div>
      <div class="card-icon">◆</div>
    </div>
  </div>

  <div class="box" style="margin-top:14px;">
    <div class="export-row">
      <button class="export-btn" onclick="exportToExcel()">
        <i data-lucide="download" style="width:16px;height:16px;"></i> Export CSV
      </button>
      <button class="export-btn" onclick="generatePDF()">
        <i data-lucide="file-text" style="width:16px;height:16px;"></i> Export PDF
      </button>
    </div>
  </div>

  <p class="section-label" style="margin-top:22px;">Add New Loan</p>

  <div class="box">
    <div class="form-grid">
      <div class="input-group" style="grid-column:1/-1;">
        <label>Loan Name</label>
        <input id="name" placeholder="e.g. Home Loan">
      </div>
      <div class="input-group">
        <label>Amount ₹</label>
        <input id="amount" type="number" placeholder="500000">
      </div>
      <div class="input-group">
        <label>Interest %</label>
        <input id="interest" type="number" placeholder="8.5">
      </div>
      <div class="input-group">
        <label>Tenure (months)</label>
        <input id="tenure" type="number" placeholder="24">
      </div>
      <div class="input-group">
        <label>Monthly EMI</label>
        <input id="emi" placeholder="Auto" readonly>
      </div>
      <div class="input-group" style="grid-column:1/-1;">
        <label>Start Date</label>
        <input id="start" type="date">
      </div>
    </div>
    <button class="btn-primary" onclick="addLoan()">
      + Add Loan
    </button>
  </div>

  <p class="section-label" style="margin-top:22px;">Active Loans</p>
  <div id="loansDashboard"></div>

</div>

<!-- ═══════════════ LOANS SCREEN ═══════════════ -->
<div class="screen" id="loansScreen">
  <p class="screen-title">Your Loans</p>
  <div id="loans"></div>
</div>

<!-- ═══════════════ CHARTS SCREEN ═══════════════ -->
<div class="screen" id="chartsScreen">
  <p class="screen-title">Analytics</p>

  <div class="chart-card">
    <div class="chart-title">Remaining Balance</div>
    <canvas id="barChart" height="200"></canvas>
  </div>

  <div class="chart-card">
    <div class="chart-title">Amortization Curve</div>
    <canvas id="lineChart" height="200"></canvas>
  </div>

  <div class="chart-card">
    <div class="chart-title">Principal vs Interest</div>
    <canvas id="pieChart" height="200"></canvas>
  </div>
</div>

<!-- ═══════════════ NAV ═══════════════ -->
<nav class="nav">
  <button class="nav-btn active" id="nav-dashboard" onclick="switchTab('dashboard')">
    <i data-lucide="home"></i>
    Home
  </button>
  <button class="nav-btn" id="nav-loansScreen" onclick="switchTab('loansScreen')">
    <i data-lucide="file-text"></i>
    Loans
  </button>
  <button class="nav-btn" id="nav-chartsScreen" onclick="switchTab('chartsScreen')">
    <i data-lucide="bar-chart-3"></i>
    Analytics
  </button>
</nav>

<script src="app.js"></script>
<script>lucide.createIcons();</script>

</body>
</html>
