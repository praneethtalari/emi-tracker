<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EMI Tracker Pro</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="header">
  <h1>💰 EMI Tracker</h1>

  <div class="header-actions">
    <button class="ghost" onclick="showStrategy()">📊 Strategy</button>
    <button class="primary" onclick="login()">🔐 Login</button>
  </div>
</header>

<!-- 👤 Profile -->
<div id="userProfile" class="user-profile hidden">
  <div class="user-left">
    <img id="userPic" class="avatar">
    <div>
      <div id="userName" class="user-name"></div>
      <div id="userEmail" class="email"></div>
    </div>
  </div>
  <button class="ghost" onclick="logout()">Logout</button>
</div>

<!-- 📊 Dashboard -->
<section class="dashboard">
  <div class="card stat">
    <div class="label">Paid</div>
    <div class="value">₹<span id="totalPaid">0</span></div>
  </div>
  <div class="card stat">
    <div class="label">Remaining</div>
    <div class="value">₹<span id="totalRemaining">0</span></div>
  </div>
  <div class="card stat">
    <div class="label">EMIs Left</div>
    <div class="value"><span id="monthsLeft">0</span></div>
  </div>
  <div class="card stat">
    <div class="label">Debt-Free</div>
    <div class="value small" id="debtFreeDate">-</div>
  </div>
</section>

<!-- ➕ Add Loan -->
<section class="glass form">
  <h3>Add Loan</h3>
  <div class="grid">
    <input id="name" placeholder="Loan Name">
    <input id="amount" type="number" placeholder="Total Amount">
    <input id="emi" type="number" placeholder="EMI">
    <input id="interest" type="number" placeholder="Interest %">
    <input id="start" type="date">
    <input id="tenure" type="number" placeholder="Tenure (months)">
  </div>
  <button class="primary full" onclick="addLoan()">Add Loan</button>
</section>

<!-- 💸 Prepayment -->
<section class="glass prepay">
  <h3>💸 Prepayment Simulator</h3>
  <div class="row">
    <input id="extra" type="number" placeholder="Extra per month">
    <button class="primary" onclick="simulate()">Simulate</button>
  </div>
  <p id="result" class="muted"></p>
</section>

<!-- 📊 Charts -->
<section class="charts">
  <div class="glass chart-card">
    <h4>Overall</h4>
    <canvas id="chart"></canvas>
  </div>

  <div class="glass chart-card">
    <h4>Amortization</h4>
    <canvas id="amortChart"></canvas>
  </div>
</section>

<!-- 📄 Loans -->
<section id="loans" class="loans"></section>

<script src="app.js"></script>
</body>
</html>
