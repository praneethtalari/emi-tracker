<!DOCTYPE html>
<html>
<head>
  <title>EMI Tracker V3</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>💰 EMI Tracker</h1>

<div class="dashboard">
  <div>Total Paid: ₹<span id="totalPaid">0</span></div>
  <div>Total Remaining: ₹<span id="totalRemaining">0</span></div>
  <div>Debt-Free In: <span id="monthsLeft">0</span> months</div>
</div>

<div class="form">
  <input id="name" placeholder="Loan Name">
  <input id="amount" type="number" placeholder="Total Amount">
  <input id="emi" type="number" placeholder="EMI">
  <input id="start" type="date">
  <input id="tenure" type="number" placeholder="Tenure">
  <button onclick="addLoan()">Add Loan</button>
</div>

<h2>📊 Overall Chart</h2>
<canvas id="overallChart"></canvas>

<div id="loans"></div>

<script src="app.js"></script>
</body>
</html>
