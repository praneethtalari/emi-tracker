<!DOCTYPE html>
<html>
<head>
  <title>EMI Tracker V4</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>💰 EMI Tracker</h1>

<button onclick="login()">🔐 Login</button>
<button onclick="showStrategy()">📊 Strategy</button>

<div class="dashboard">
  <div>Total Paid: ₹<span id="totalPaid">0</span></div>
  <div>Total Remaining: ₹<span id="totalRemaining">0</span></div>
  <div>EMIs Left: <span id="monthsLeft">0</span></div>
</div>

<div class="form">
  <input id="name" placeholder="Loan Name">
  <input id="amount" type="number" placeholder="Total Amount">
  <input id="emi" type="number" placeholder="EMI">
  <input id="start" type="date">
  <input id="tenure" type="number" placeholder="Tenure">
  <button onclick="addLoan()">Add Loan</button>
</div>

<canvas id="chart"></canvas>

<div id="loans"></div>

<script src="app.js"></script>
</body>
</html>
