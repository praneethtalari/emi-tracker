<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EMI Tracker</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- STYLE -->
  <link rel="stylesheet" href="style.css">

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- ICONS -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<header>
  <h2>💰 EMI Tracker</h2>
  <button onclick="login()">Login</button>
</header>

<div id="userProfile" class="hidden profile">
  <img id="userPic">
  <div>
    <div id="userName"></div>
    <div id="userEmail"></div>
  </div>
  <button onclick="logout()">Logout</button>
</div>

<div class="screen active" id="dashboard">

  <div class="cards">
    <div>Paid ₹<span id="totalPaid">0</span></div>
    <div>Remaining ₹<span id="totalRemaining">0</span></div>
    <div>EMIs <span id="monthsLeft">0</span></div>
    <div>Debt-Free <span id="debtFreeDate">-</span></div>
  </div>

  <div class="box">
    <button onclick="exportToExcel()">📥 Excel</button>
    <button onclick="generatePDF()">📄 PDF</button>
  </div>

  <div class="box">
    <h3>Add Loan</h3>
    <input id="name" placeholder="Loan Name">
    <input id="amount" type="number" placeholder="Amount">
    <input id="interest" type="number" placeholder="Interest %">
    <input id="tenure" type="number" placeholder="Months">
    <input id="emi" type="number" placeholder="EMI (auto)" readonly>
    <input id="start" type="date">
    <button onclick="addLoan()">Add Loan</button>
  </div>

  <div id="loansDashboard"></div>
</div>

<div class="screen" id="loansScreen">
  <h3>Your Loans</h3>
  <div id="loans"></div>
</div>

<div class="nav">
  <button onclick="switchTab('dashboard')"><i data-lucide="home"></i></button>
  <button onclick="switchTab('loansScreen')"><i data-lucide="file-text"></i></button>
</div>

<script src="app.js"></script>
<script>lucide.createIcons();</script>

</body>
</html>
